services:
  - type: web
    name: nail-room-booking-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: APP_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /opt/render/project/src/data

